services:
  postgres:
    image: postgres:16-alpine
    container_name: apex-gst-postgres
    restart: always
    environment:
      POSTGRES_DB: apexgst
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - apex_pg_data:/var/lib/postgresql/data
      - ./apex-backend/src/main/resources/schema-postgres.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apexgst"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  apex_pg_data:
    driver: local
